# Construit automatiquement Cockpit.exe sur un serveur Windows de GitHub.
# Onglet "Actions" du dépôt → "Construire l'exe Windows" → "Run workflow", puis télécharge l'artefact.
name: Construire l'exe Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests du moteur
        run: python -m pytest -q
      - name: Construction
        run: pyinstaller --noconfirm --onefile --name Cockpit --add-data "static;static" run.py
      - name: Ajout de la configuration corpo (si présente)
        shell: bash
        run: |
          mkdir -p release
          cp dist/Cockpit.exe release/
          [ -f distribution.json ] && cp distribution.json release/ || true
          cp README.md release/LISEZMOI.md
      - uses: actions/upload-artifact@v4
        with:
          name: Cockpit-windows
          path: release/
