# Publie le site de présentation (dossier site/) sur GitHub Pages.
# Activer : Settings → Pages → Source : GitHub Actions.
name: Publier le site
on:
  workflow_dispatch:
  push:
    paths: ["site/**"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
