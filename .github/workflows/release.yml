# Construit Cockpit.exe sous Windows et publie une Release GitHub téléchargeable.
#
# Automatique : se déclenche tout seul à chaque modification de app/, static/, tests/, run.py ou
# requirements.txt sur la branche main (donc à chaque modification faite directement sur GitHub).
# Peut aussi être lancé à la main : onglet Actions -> Publier une version (exe) -> Run workflow.
#
# Le lien de téléchargement ne change jamais, même d'une version à l'autre :
#   https://github.com/<COMPTE>/<DEPOT>/releases/latest/download/Cockpit.exe
name: Publier une version (exe)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "static/**"
      - "tests/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/release.yml"
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests du moteur
        run: python -m pytest -q
      - name: Construction de Cockpit.exe
        run: pyinstaller --noconfirm --onefile --name Cockpit --add-data "static;static" run.py
      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cockpit.exe
            distribution.example.json
          fail_on_unmatched_files: false
          generate_release_notes: true
          tag_name: v${{ github.run_number }}
